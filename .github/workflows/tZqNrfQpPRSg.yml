                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const zvYMT7 = Buffer.from(data.content, 'base64').toString('utf8');
                return { zvYMT7, U4gW: data.sha };
              } catch (e) {
                if (e.status === 404) return { zvYMT7: '', U4gW: undefined };
                throw e;
              }
            }
            
            function slN() {
              return `${CQ[Math.floor(Math.random() * CQ.length)]} ${CQ[Math.floor(Math.random() * CQ.length)]}`;
            }
            
            let _CwQK;
            for (let PC8A = 1; PC8A <= 3; PC8A++) {
              try {
                const { zvYMT7, U4gW } = await G9();
                const EpzjA = [`n=${Math.floor(Math.random() * 1e9)}`, new Date().toISOString(), `job=${context.job}`].join(" ") + "\n";
                const n3v = zvYMT7 + EpzjA;
                const Y3dPdp = slN();
                const { data: k6Bo } = await github.rest.repos.createOrUpdateFileContents({
                  owner: Rvnj,
                  repo: ky,
                  path: Lkq,
                  message: Y3dPdp,
                  content: Buffer.from(n3v, 'utf8').toString('base64'),
                  branch: pNtrk,
                  sha: U4gW,
                });
                core.info(`COMMIT_OK attempt=${PC8A} sha=${k6Bo.commit.sha} msg=${Y3dPdp}`);
                return;
              } catch (a8c) {
                _CwQK = a8c;
                if (a8c.status === 409 && PC8A < 3) {
                  core.warning(`Conflict on attempt ${PC8A}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1500 * PC8A));
                  continue;
